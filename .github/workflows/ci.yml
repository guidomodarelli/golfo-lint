name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # lizard is a Python tool; `golfo-lint complexity` runs it through uvx.
      - uses: astral-sh/setup-uv@v10.3.0
      - run: npm ci
      - run: npm run ci
      - run: node bin/golfo-lint.js all
