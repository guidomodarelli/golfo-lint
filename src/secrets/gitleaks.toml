# Shared gitleaks config of @golfo/lint: every default rule, plus one exemption.
title = "@golfo/lint"

[extend]
useDefault = true

# generic-api-key matches any long, random-looking value next to a word like "token" or "key". In tests
# (idempotency keys, fake token ids) and in Markdown prose it only finds placeholders. The provider rules
# (GitHub, AWS, Stripe, Google, Slack...) still apply to these files.
[[allowlists]]
description = "Valores de prueba y prosa: la regla genérica solo encuentra placeholders"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)(test|tests|__tests__|e2e|fixtures)/''',
  '''\.(test|spec)\.[cm]?[jt]sx?$''',
  '''\.mdx?$''',
]
