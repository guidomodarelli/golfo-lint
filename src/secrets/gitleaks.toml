# Shared gitleaks config of @golfo/lint: every default rule, plus one exemption.
title = "@golfo/lint"

[extend]
useDefault = true

# generic-api-key matches any long, random-looking value next to a word like "token" or "key". In tests
# (idempotency keys, fake token ids) and in Markdown prose it only finds placeholders. The provider rules
# (GitHub, AWS, Stripe, Google, Slack...) still apply to these files.
[[allowlists]]
description = "Valores de prueba y prosa: la regla genérica solo encuentra placeholders"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)(test|tests|__tests__|e2e|fixtures)/''',
  '''\.(test|spec)\.[cm]?[jt]sx?$''',
  '''\.mdx?$''',
]

# golfo-kit writes `.golfo/skill-coverage/` (records and runs of the skills it tracks): JSON that maps each
# `file#SYMBOL` to a 16-hex content hash. Keys such as `...TOKEN.kind` or `...hasLinkedInvitations` next to a hash
# look like `generic-api-key` or `linkedin-client-secret` to gitleaks. Only those hashes, for those two rules, are
# exempt: any other value in these files is still checked by every rule.
[[allowlists]]
description = "Hashes de contenido de .golfo/skill-coverage"
targetRules = ["generic-api-key", "linkedin-client-secret"]
condition = "AND"
paths = ['''(^|/)\.golfo/skill-coverage/.+\.json$''']
regexTarget = "secret"
regexes = ['''^[0-9a-f]{16}$''']
